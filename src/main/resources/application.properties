
spring.application.name=healthcare-system

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/healthcare_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080
spring.security.user.name=admin
spring.security.user.password=HealthCare@123
logging.level.org.springframework.security=DEBUG
logging.level.healthcare_system=DEBUG
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Application Information
management.info.env.enabled=true
info.app.name=Secure Healthcare Management System
info.app.description=Healthcare Management and Security Application
info.app.version=1.0.0

# Prometheus Metrics
management.prometheus.metrics.export.enabled=true